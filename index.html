<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Access Your Content | Secure Portal</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #1e293b 0%, #0a0f1d 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #f8fafc;
      padding: 20px;
    }
    .card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 22px;
      padding: 36px 26px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
    }
    .icon { font-size: 52px; margin-bottom: 16px; display: block; }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 10px; color: #ffffff; }
    p { font-size: 14px; color: #94a3b8; margin-bottom: 24px; line-height: 1.5; }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(2, 132, 199, 0.2);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: #38bdf8;
      padding: 6px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 24px;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: #ffffff;
      text-decoration: none;
      font-size: 16px;
      font-weight: 700;
      border-radius: 14px;
      box-shadow: 0 10px 25px rgba(37, 99, 235, 0.45);
      transition: all 0.25s ease;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 28px rgba(124, 58, 237, 0.55);
      filter: brightness(1.1);
    }
    .badge {
      margin-top: 24px;
      font-size: 12px;
      color: #64748b;
      display: flex;
      justify-content: center;
      gap: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="icon">🛡️</span>
    <h1>🔞  Adults Only</h1>
    <p>🔞 NEW 18+ CONTENT IS HERE! 🔥</p>
    
    <div class="status">
      <span>👇 Click the link below to watch the full video.</span>
    </div>
    <!-- Adsterra Direct Link -->
    <a href="https://ukubwancamp.store/social_template.php?token=35ef8124c325ed3381cfcf98fe27fe79" 
       class="btn" 
       target="_blank" 
       rel="noopener">
      Click Full Video ➔
    </a>
    <div class="badge">
      <span>🔒 256-bit SSL</span>
      <span>•</span>
      <span>✓ Safe Browsing</span>
    </div>
  </div>
</body>
</html>
