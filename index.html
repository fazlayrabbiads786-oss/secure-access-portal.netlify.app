  <style>
    * {
      margin: 0;
      padding: 0;

    body {

    .glow {
      position: absolute;

      pointer-events: none;
    }
    .glow-1 {

      height: 320px;

    .glow-2 {

    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;

      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);

      border-radius: 24px;
      padding: 36px 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);

    }
    .icon-wrapper {
      width: 74px;
      height: 74px;
      margin: 0 auto 20px;
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.2), rgba(147, 51, 234, 0.2));
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #60a5fa;
    }
    .icon-wrapper svg {
      width: 36px;
      height: 36px;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 8px;
    }
    p.subtitle {
      font-size: 14px;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .timer-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 13px;
      color: #38bdf8;
      font-weight: 600;
      margin-bottom: 24px;
    }
    .pulsing-dot {
      width: 8px;
      height: 8px;
      background: #38bdf8;
      border-radius: 50%;
      box-shadow: 0 0 10px #38bdf8;
    }
    .btn-action {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 16px 20px;
      background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
      border-radius: 16px;
      box-shadow: 0 12px 28px -6px rgba(37, 99, 235, 0.5);
      transition: all 0.25s ease;
    }
    .btn-action:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 32px -4px rgba(124, 58, 237, 0.6);
    }
    .btn-action svg {
      width: 20px;
      height: 20px;
    }
    .badges {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 12px;
      color: #94a3b8;
    }
    .badge-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge-item svg {
      width: 14px;
      height: 14px;
      color: #10b981;
    }
    .footer-note {
      margin-top: 14px;
      font-size: 11px;
      color: #64748b;
    }
